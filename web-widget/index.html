<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10162e" />
    <title>iWeather — web widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-stage">
      <section class="weather-widget" aria-label="Прогноз погоды">
        <header class="widget-header">
          <div class="location-bar">
            <span class="icon icon-location" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" />
                <circle cx="12" cy="10" r="2.4" />
              </svg>
            </span>
            <strong>Дом</strong>
          </div>
          <div class="header-actions">
            <button class="icon-button" id="refresh-button" type="button" aria-label="Обновить прогноз" title="Обновить прогноз">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-14.8-4.5L4 8" />
                <path d="M4 4v4h4" />
                <path d="M4 13a8.1 8.1 0 0 0 14.8 4.5L20 16" />
                <path d="M20 20v-4h-4" />
              </svg>
            </button>
            <button class="icon-button" id="wallet-button" type="button" aria-label="Кошелёк" title="Кошелёк" aria-controls="wallet-panel" aria-expanded="false">
              <img src="./assets/wallet/wallet.svg" alt="" aria-hidden="true" />
            </button>
            <button class="icon-button" id="settings-button" type="button" aria-label="Настройки виджета" title="Настройки виджета">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 15.1a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Z" />
                <path d="m19.4 15 .1.1a1.9 1.9 0 0 1-2.7 2.7l-.1-.1a1.9 1.9 0 0 0-3.2 1.4v.2a1.9 1.9 0 0 1-3.8 0v-.2a1.9 1.9 0 0 0-3.2-1.4l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1A1.9 1.9 0 0 0 2.4 12a1.9 1.9 0 0 0 1.4-3.2l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.9 1.9 0 0 0 3.2-1.4v-.2a1.9 1.9 0 0 1 3.8 0v.2a1.9 1.9 0 0 0 3.2 1.4l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1A1.9 1.9 0 0 0 20.8 12a1.9 1.9 0 0 0-1.4 3Z" />
              </svg>
            </button>
          </div>
        </header>

        <section class="wallet-panel" id="wallet-panel" aria-labelledby="wallet-title" hidden>
          <h2 id="wallet-title">Поблагодарить</h2>
          <p>Выберите валюту и сеть, затем нажмите на адрес, чтобы скопировать его.</p>
          <div class="wallet-list" id="wallet-list"></div>
        </section>

        <div class="current-weather">
          <div class="current-summary">
            <img class="current-icon" src="./assets/weather-icons-figma/cloudy.png" alt="" />
            <div class="current-copy">
              <div class="current-temperature">20°</div>
              <div class="current-condition">Пасмурно</div>
            </div>
          </div>
          <dl class="current-range" aria-label="Диапазон температуры на сегодня">
            <div>
              <dt>Макс.</dt>
              <dd>20°C</dd>
            </div>
            <div>
              <dt>Мин.</dt>
              <dd>12°C</dd>
            </div>
          </dl>
        </div>

        <section class="forecast-section hourly-section" aria-labelledby="hourly-title">
          <h2 id="hourly-title">СЕГОДНЯ — ПОЧАСОВОЙ ПРОГНОЗ</h2>
          <div class="hourly-layout">
            <button class="forecast-arrow" id="hourly-prev" type="button" aria-label="Предыдущие часы" title="Предыдущие часы">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <div class="hourly-viewport">
              <div class="hourly-track" id="hourly-track"></div>
            </div>
            <button class="forecast-arrow" id="hourly-next" type="button" aria-label="Следующие часы" title="Следующие часы">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
        </section>

        <section class="forecast-section daily-section" aria-labelledby="daily-title">
          <h2 id="daily-title">ПРОГНОЗ НА 10 ДНЕЙ</h2>
          <div class="daily-scroll" id="daily-list"></div>
        </section>

        <div class="widget-status" id="widget-status" role="status" aria-live="polite"></div>
        <div class="settings-hint" id="settings-hint" hidden>
          Веб-версия использует демонстрационные данные. Внешний вид меняется в <code>web-widget/styles.css</code>.
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
